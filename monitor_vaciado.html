*{box-sizing:border-box}body{margin:0;padding:25px;background:#edf3f6;color:#19384a;font:15px system-ui}header,.tools,.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:6px 0;font-size:28px}h2{font-size:21px;margin:0}.small{color:#637d8b;font-size:12px}button,input,select{padding:10px;border:1px solid #cbd9df;border-radius:8px;background:white;color:inherit;font:inherit}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.tablebox,#sync{background:white;border:1px solid #dce7ec;border-radius:16px;padding:18px}.badge{font-size:12px;padding:6px;background:#eef2f4;border-radius:8px}.bad{color:#af263c;background:#ffeef0}.ok{color:#0e7856;background:#e6f6ef}.metrics{display:flex;justify-content:space-between;margin:18px 0}.metrics strong{display:block;font-size:26px}.metrics small{display:block;font-size:11px;color:#637d8b}.chart{border-top:1px solid #e6eef2;padding-top:10px;margin-top:10px}.chart svg{width:100%;height:125px}.tablebox{margin-top:20px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}td,th{padding:12px;border-bottom:1px solid #edf2f5;text-align:left}#sync,#summary{margin:18px 0}dialog{border:0;border-radius:18px;width:90%;max-width:580px}dialog img{width:100%;max-height:50vh;object-fit:contain}dialog::backdrop{background:#19384aaa}pre{white-space:pre-wrap;font:14px system-ui}@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style><header><div><span class="small">INDUSTRIALIZACIÓN DE FRUTA</span><h1>Monitor de estanques</h1><span class="small">Línea 1 · Línea 2 · Hidrocooler</span></div><div class="tools"><input id="fecha" type="date" aria-label="Fecha"><button id="hoy">Hoy</button><button id="actualizar">Actualizar</button></div></header><div id="sync" role="status">Conectando…</div><div id="summary"></div><main class="grid" id="cards"></main><section class="tablebox"><div class="head"><h2>Controles del día</h2><select id="filtro" aria-label="Estanque"><option value="">Todos</option value="vaciado_linea_1">Línea 1</option><option value="vaciado_linea_2">Línea 2</option><option value="hidrocooler">Hidrocooler</option></select></div><table><thead><tr><th>Hora</th><th>Estanque</th><th>Operador</th><th>Lote</th><th>PPM</th><th>ORP</th><th>pH</th><th>Kilos</th><th>Corrección</th><th>Detalle</th></tr></thead><tbody id="rows"></tbody></table></section><dialog id="detalle"><button id="cerrar">Cerrar</button><pre id="texto"></pre><img id="foto" alt="Respaldo del control"><p id="fotoError"></p></dialog><script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbwrCCj37lEnV5UiOkV0ZQuZ0phjVNIf_UNjgQH6JEnKenLaIzuWZWvIiugvCfyOY0U-FA/exec';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let model=null,seguir=true,seq=0;const keys=['ppm','orp','ph'];const valido=v=>typeof v==='number'&&Number.isFinite(v);
function hoy(){const p=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'America/Santiago',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day;}
function estado(r,k){return !valido(r[k])?'missing':r[k]<model.rangos[k].min||r[k]>model.rangos[k].max?'bad':'ok';}
function valor(v){return valido(v)?v.toLocaleString('es-CL'):'—';}
function chart(reg,k){const lim=model.rangos[k],v=reg.filter(r=>valido(r[k]));if(!v.length)return '<p class="small">Sin mediciones</p>';const lo=Math.min(lim.min,...v.map(r=>r[k])),hi=Math.max(lim.max,...v.map(r=>r[k])),pad=(hi-lo)*.2||1;
 const y=n=>100-(n-lo+pad)/(hi-lo+2*pad)*90,x=i=>45+(reg.length===1?115:230*i/(reg.length-1));let s='<svg viewBox="0 0 300 125" role="img" aria-label="Evolución de '+k+'"><rect x="42" width="238" y="'+y(lim.max)+'" height="'+(y(lim.min)-y(lim.max))+'" fill="#e7f5ed"/>';
 [lim.min,lim.max].forEach(n=>s+='<line x1="42" x2="280" y1="'+y(n)+'" y2="'+y(n)+'" stroke="#a1b9b1" stroke-dasharray="4 3"/><text x="0" y="'+(y(n)+4)+'" font-size="10">'+n+'</text>');let prev=null;
 reg.forEach((r,i)=>{if(!valido(r[k])){prev=null;return;}const p=[x(i),y(r[k])];if(prev)s+='<line x1="'+prev[0]+'" y1="'+prev[1]+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#259b82" stroke-width="2"/>';prev=p;});
 reg.forEach((r,i)=>{if(valido(r[k]))s+='<circle cx="'+x(i)+'" cy="'+y(r[k])+'" r="4" fill="'+(estado(r,k)==='bad'?'#d93651':'#13856d')+'"><title>'+esc(r.hora+' · '+r[k]+(r.correccion==='SI'?' · Corrección':''))+'</title></circle>';});return s+'<text x="42" y="120" font-size="10">'+esc(reg[0].hora)+'</text><text x="280" y="120" text-anchor="end" font-size="10">'+esc(reg.at(-1).hora)+'</text></svg>';}
function render(){const all=model.registros;$('summary').textContent=all.length+' controles · '+all.filter(r=>keys.some(k=>estado(r,k)==='bad')).length+' fuera de rango · '+all.filter(r=>r.correccion==='SI').length+' correcciones';$('cards').innerHTML=Object.entries(model.origenes).map(([id,nombre])=>{const reg=all.filter(r=>r.origen===id),last=reg.at(-1),st=!last?'Sin controles':keys.some(k=>estado(last,k)==='missing')?'Incompleto':keys.some(k=>estado(last,k)==='bad')?'Fuera de rango':'En rango';return '<article class="card"><div class="head"><h2>'+esc(nombre)+'</h2><span class="badge '+(st==='En rango'?'ok':st==='Fuera de rango'?'bad':'')+'">'+st+'</span></div><p class="small">'+reg.length+' controles · Último: '+(last?esc(last.hora):'—')+'</p><div class="metrics">'+keys.map(k=>'<div><small>'+k.toUpperCase()+'</small><strong class="'+(last&&estado(last,k)==='bad'?'bad':'')+'">'+(last?valor(last[k]):'—')+'</strong><small>'+model.rangos[k].min+' – '+model.rangos[k].max+'</small></div>').join('')+'</div><p class="small">'+(last?'Operador: '+esc(last.operador):'Sin registros para esta fecha')+'</p>'+keys.map(k=>'<div class="chart"><b>'+k.toUpperCase()+'</b>'+chart(reg,k)+'</div>').join('')+'</article>';}).join('');rows();}
function rows(){if(!model)return;$('rows').innerHTML=model.registros.map((r,i)=>({r,i})).filter(({r})=>!$('filtro').value||r.origen===$('filtro').value).reverse().map(({r,i})=>'<tr><td>'+esc(r.hora)+'</td><td>'+esc(model.origenes[r.origen]||r.origen)+'</td><td>'+esc(r.operador)+'</td><td>'+esc(r.lote)+'</td>'+keys.map(k=>'<td class="'+(estado(r,k)==='bad'?'bad':'')+'">'+valor(r[k])+'</td>').join('')+'<td>'+esc(r.kilos===''?'—':r.kilos)+'</td><td>'+esc(r.correccion)+'</td><td><button data-index="'+i+'">Ver</button></td></tr>').join('')||'<tr><td colspan="10">Sin registros</td></tr>';}
function leer(f){if(window.google&&google.script&&google.script.run)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).datosMonitor(f));return fetch(WEB_APP_URL+'?accion=monitorV2&fecha='+encodeURIComponent(f),{signal:AbortSignal.timeout(25000)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();});}
async function refresh(){const n=++seq;if(seguir)$('fecha').value=hoy();const f=$('fecha').value;if(!f)return;$('sync').textContent='Actualizando '+f+'…';try{const d=await leer(f);if(n!==seq)return;if(!Array.isArray(d.registros))throw Error(d.mensaje||'Respuesta inválida');model=d;render();$('sync').textContent='Fecha '+f+' · Actualizado '+new Date().toLocaleTimeString('es-CL',{timeZone:'America/Santiago'})+' · Consulta cada 30 segundos';$('sync').classList.remove('bad');}catch(e){if(n!==seq)return;$('sync').textContent='Sin actualización: '+e.message+'. Los datos visibles pueden estar desactualizados.';$('sync').classList.add('bad');}}
$('fecha').value=hoy();$('fecha').onchange=()=>{seguir=false;model=null;['cards','rows','summary'].forEach(k=>$(k).textContent='');refresh();};$('hoy').onclick=()=>{seguir=true;refresh();};$('actualizar').onclick=refresh;$('filtro').onchange=rows;$('cerrar').onclick=()=>$('detalle').close();$('foto').onerror=()=>{$('foto').hidden=true;$('fotoError').textContent='No se pudo cargar la fotografía. Revisar permisos de Drive.';};
$('rows').onclick=e=>{const b=e.target.closest('[data-index]');if(!b)return;const r=model.registros[Number(b.dataset.index)];$('texto').textContent=Object.entries(r).filter(([k])=>k!=='foto').map(([k,v])=>k+': '+v).join('\n');$('foto').hidden=true;$('fotoError').textContent='';try{const u=new URL(r.foto);if(u.protocol!=='https:'||u.hostname!=='drive.google.com')throw Error();$('foto').hidden=false;$('foto').src=u.href;}catch(e){$('fotoError').textContent='Sin fotografía disponible';}$('detalle').showModal();};refresh();setInterval(refresh,30000);

 document.body.appendChild(panel);const n=id=>document.getElementById('nav-'+id);let version=0;
 const escapar=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const hosted=!!(window.google&&google.script&&google.script.run);

 function enlazar(base){try{const u=new URL(base);if(u.protocol!=='https:')throw Error();u.search='';u.searchParams.set('vista',operador?'monitor':'operador');n('destino').href=u.href;n('destino').removeAttribute('aria-disabled');n('link-status').textContent='';}catch(e){n('link-status').textContent='Configura la URL de implementación para activar el enlace.';}}
 if(hosted)google.script.run.withSuccessHandler(enlazar).withFailureHandler(()=>n('link-status').textContent='No se pudo cargar el enlace. Vuelve a abrir esta página.').obtenerUrlApp();else enlazar(WEB_APP_URL);

 async function consulta(f){if(hosted)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).buscarControles(f));const u=new URL(WEB_APP_URL);u.search='';u.searchParams.set('accion','buscarControles');Object.entries(f).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u.href,{signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
 n('form').onsubmit=async e=>{e.preventDefault();const turno=++version;const f=Object.fromEntries(['texto','exportadora','lote','productor','variedad','fecha','origen'].map(k=>[k,n(k).value.trim()]));n('search').disabled=true;n('results').textContent='';n('status').textContent='Buscando controles…';try{const res=await consulta(f);if(turno!==version)return;if(!Array.isArray(res.registros))throw Error(res.mensaje||'Respuesta inválida');n('status').textContent=res.total?res.total+' coincidencias'+(res.total>res.limite?' · Se muestran las '+res.limite+' más recientes; precisa los filtros.':'.'):'No se encontraron controles con esos criterios.';
