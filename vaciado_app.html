<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Estanques</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
body{background:#f0f2f5;padding:15px;font-family:'Segoe UI',sans-serif}
.card{max-width:480px;margin:auto;border:0;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
.header{text-align:center;padding:25px;border-bottom:4px solid #198754}
.logo{height:60px}
.mode-btn{font-weight:800;border-radius:12px;padding:12px 5px;font-size:.75rem}
.mode-btn.active{background:#198754;color:#fff}
.form-control{padding:12px}
.section-title{font-weight:800;color:#198754;border-bottom:1px solid #ddd;padding-bottom:6px;margin:18px 0 12px}
.file-label{display:block;text-align:center;border:2px dashed #ccc;border-radius:12px;padding:15px;cursor:pointer}
</style>
</head>

<body>

<div class="container py-4">
<div class="card">

<div class="header">
<img src="logo-icono.png" class="logo" onerror="this.style.display='none'">
<h4 class="fw-bold">CONTROL DE ESTANQUES</h4>
<p class="text-muted mb-0">Industrialización de Fruta</p>
</div>

<div class="card-body p-4">

<div class="row g-2 mb-3">
<div class="col-4">
<button type="button" class="btn btn-outline-success w-100 mode-btn active" onclick="cambiarTipo('vaciado_linea_1',this)">
<i class="bi bi-droplet d-block"></i>Línea 1
</button>
</div>

<div class="col-4">
<button type="button" class="btn btn-outline-success w-100 mode-btn" onclick="cambiarTipo('vaciado_linea_2',this)">
<i class="bi bi-droplet d-block"></i>Línea 2
</button>
</div>

<div class="col-4">
<button type="button" class="btn btn-outline-info w-100 mode-btn" onclick="cambiarTipo('hidrocooler',this)">
<i class="bi bi-water d-block"></i>Hidro
</button>
</div>
</div>


<form id="formControl">

<div class="section-title">Datos del proceso</div>

<input id="exportadora" class="form-control mb-2" placeholder="Exportadora" required>

<input id="productor" class="form-control mb-2" placeholder="Productor" required>

<div class="row g-2">
<div class="col-6">
<input id="lote" class="form-control" placeholder="Lote" required>
</div>
<div class="col-6">
<input id="variedad" class="form-control" placeholder="Variedad" required>
</div>
</div>

<input id="operador" class="form-control mt-2 mb-3" placeholder="Operador responsable" required>


<div class="section-title">Control de estanque</div>

<div class="row g-3">

<div class="col-6">
<label class="form-label fw-bold">PPM</label>
<input id="ppm" type="number" step="0.1" class="form-control">
</div>

<div class="col-6">
<label class="form-label fw-bold">ORP</label>
<input id="orp" type="number" class="form-control">
</div>

<div class="col-6">
<label class="form-label fw-bold">PH</label>
<input id="ph" type="number" step="0.1" class="form-control">
</div>

<div class="col-6" id="bloqueKilos">
<label class="form-label fw-bold">Kilos</label>
<input id="kilos" type="number" class="form-control">
</div>

</div>


<div class="form-check form-switch my-4">
<input id="correccion" class="form-check-input" type="checkbox">
<label class="form-check-label fw-bold">¿Es corrección?</label>
</div>


<label class="fw-bold">FOTO DE RESPALDO (OBLIGATORIA)</label>

<input id="foto" type="file" accept="image/*" capture="environment" hidden>

<label for="foto" class="file-label">
<i class="bi bi-camera-fill fs-3"></i>
<br>
<span id="fotoTexto">Tomar fotografía</span>
</label>


<button id="btnEnviar" class="btn btn-success w-100 mt-4 p-3 fw-bold">
<i class="bi bi-cloud-upload"></i> GUARDAR REGISTRO
</button>

</form>

<div id="mensaje" class="alert alert-success mt-3 d-none text-center fw-bold">
Registro enviado correctamente
</div>

<div id="error" class="alert alert-danger mt-3 d-none"></div>

</div>
</div>
</div>


<script>

const WEB_APP_URL="https://script.google.com/macros/s/AKfycbyd1Y3m9Jwwj3K_DKtogIZliBw7Y-sP_0mWrq5R97e9PhlSjpJRDXRxfv3x86EN0cnm7w/exec";

let tipoActual="vaciado_linea_1";


function cambiarTipo(tipo,btn){

tipoActual=tipo;

document.querySelectorAll(".mode-btn")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

document.getElementById("bloqueKilos").style.display=
tipo==="hidrocooler"?"none":"block";

}


foto.addEventListener("change",()=>{

fotoTexto.innerHTML="✅ Foto capturada";

});


formControl.addEventListener("submit",e=>{

e.preventDefault();

error.classList.add("d-none");

if(!foto.files[0]){
error.innerHTML="Debe tomar fotografía de respaldo";
error.classList.remove("d-none");
return;
}


let reader=new FileReader();

reader.onload=()=>{


let datos={

origen:tipoActual,

exportadora:exportadora.value,
productor:productor.value,
lote:lote.value,
variedad:variedad.value,

operador:operador.value,

ppm:Number(ppm.value),
orp:Number(orp.value),
ph:Number(ph.value),

kilos:tipoActual==="hidrocooler"?null:Number(kilos.value),

correccion:correccion.checked,

foto:reader.result

};


btnEnviar.disabled=true;

fetch(WEB_APP_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(datos)
})
.then(()=>{

mensaje.classList.remove("d-none");

btnEnviar.disabled=false;

});

};


reader.readAsDataURL(foto.files[0]);

});

</script>

</body>
</html>
