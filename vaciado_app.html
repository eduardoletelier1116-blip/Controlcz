<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de estanques</title><style>*{box-sizing:border-box}body{background:#eef3f5;font:16px system-ui;color:#19384a;padding:18px}.card{max-width:480px;margin:auto;padding:25px;background:white;border-radius:20px}h1{font-size:24px;text-align:center}.modes{display:flex;gap:8px;margin:20px 0}button{cursor:pointer;padding:12px;border:1px solid #b4d7c8;border-radius:9px;background:white;font:inherit}.modes button{flex:1;font-size:13px}.active,#btnEnviar{background:#198754;color:white}label{display:block;margin:12px 0;font-weight:600}input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #ccd8de;border-radius:8px;font:inherit}input[type=checkbox]{display:inline;width:auto}.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}#btnEnviar{width:100%;margin-top:15px}.d-none{display:none}#error{color:#a52639}#mensaje{color:#137550}button:disabled{opacity:.6}.logo-marca{display:block;width:230px;max-width:100%;height:auto;margin:0 auto 18px}
/* Interruptor de corrección */
.correccion-switch{display:flex;align-items:center;gap:12px;padding:16px;background:#f3f8f5;border-radius:12px;cursor:pointer;position:relative}
.correccion-switch>span:first-child{flex:1}
.correccion-switch #correccion{position:absolute;width:1px;height:1px;padding:0;margin:0;opacity:0}
.switch-pista{display:block;width:52px;height:30px;flex-shrink:0;background:#b8c4cc;border-radius:30px;position:relative;transition:background .2s}
.switch-pista::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:white;border-radius:50%;box-shadow:0 1px 4px #0002;transition:transform .2s}
#correccion:checked+.switch-pista{background:#198754}
#correccion:checked+.switch-pista::before{transform:translateX(22px)}
#correccion:focus-visible+.switch-pista{outline:3px solid #195fba;outline-offset:3px}
.switch-estado{min-width:24px}.estado-si{display:none}
#correccion:checked~.switch-estado .estado-no{display:none}
#correccion:checked~.switch-estado .estado-si{display:inline;color:#198754}
#correccion:disabled~span{opacity:.55}
@media(prefers-reduced-motion:reduce){.switch-pista,.switch-pista::before{transition:none}}
