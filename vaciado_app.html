utton class="mode-btn" onclick="cambiarTipo('vaciado_linea_2',this)">Línea 2</button><button class="mode-btn" onclick="cambiarTipo('hidrocooler',this)">Hidro</button></div><form id="formControl"><label>Exportadora<input id="exportadora" required placeholder="Exportadora"></label><label>Productor<input id="productor" required placeholder="Productor"></label><label>Lote<input id="lote" required placeholder="Lote"></label><label>Variedad<input id="variedad" required placeholder="Variedad"></label><label>Operador responsable<input id="operador" required placeholder="Operador responsable"></label><div class="nums"><label>PPM<input id="ppm" type="number" step="0.1" required></label><label>ORP<input id="orp" type="number" step="1" required></label><label>pH<input id="ph" type="number" step="0.1" required></label><label id="bloqueKilos">Kilos<input id="kilos" type="number" step="0.1"></label></div><label><input id="correccion" type="checkbox"> ¿Es corrección?</label><label>Fotografía obligatoria<input id="foto" type="file" accept="image/*" capture="environment"></label><span id="fotoTexto">Tomar fotografía</span><button id="btnEnviar">GUARDAR REGISTRO</button></form><p id="mensaje" class="d-none" role="status"></p><p id="error" class="d-none" role="alert"></p></div><script>// Sustituye el contenido del bloque <script> de la app original.

const el=id=>document.getElementById(id);let tipoActual='vaciado_linea_1',enviando=false,pendiente=null;
function cambiarTipo(tipo,btn){if(enviando||pendiente)return;tipoActual=tipo;document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');el('bloqueKilos').style.display=tipo==='hidrocooler'?'none':'block';el('kilos').required=tipo!=='hidrocooler';}
['ppm','orp','ph','kilos'].forEach(k=>el(k).required=true);el('ppm').min=0;el('ph').min=0;el('ph').max=14;el('kilos').min=0;
el('foto').onchange=()=>el('fotoTexto').textContent=el('foto').files.length?'Fotografía seleccionada':'Tomar fotografía';
function bloquear(on){document.querySelectorAll('#formControl input,.mode-btn').forEach(x=>x.disabled=on);}
function leerFoto(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('No se pudo leer la fotografía'));r.readAsDataURL(f);});}

function enviar(d){if(window.google&&google.script&&google.script.run)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).guardarControl(d));return fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d),signal:AbortSignal.timeout(90000)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();});}
