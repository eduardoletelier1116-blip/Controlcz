from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Estanques</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<style>
body{
    background:#f0f2f5;
    padding:15px;
    font-family:'Segoe UI',sans-serif;
}
.card{
    max-width:480px;
    margin:auto;
    border-radius:20px;
    border:none;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.header{
    text-align:center;
    padding:25px;
    border-bottom:4px solid #198754;
}
.logo{
    height:60px;
}
.form-control{
    padding:12px;
}
.tab-btn{
    font-weight:800;
    border-radius:12px;
    padding:12px 5px;
}
.tab-btn.active{
    background:#198754;
    color:white;
}
.section-title{
    color:#198754;
    font-weight:800;
    font-size:.8rem;
    border-bottom:1px solid #ddd;
    margin-bottom:15px;
    padding-bottom:5px;
}
.file-label{
    display:block;
    text-align:center;
    border:2px dashed #ccc;
    border-radius:12px;
    padding:15px;
}
</style>
</head>

<body>

<div class="container py-4">
<div class="card">

<div class="header">
<img src="logo-icono.png" class="logo" onerror="this.style.display='none'">
<h4 class="fw-bold">CONTROL DE ESTANQUES</h4>
<p class="text-muted mb-0">Industrialización de Fruta</p>
</div>

<div class="card-body p-4">

<div class="row g-2 mb-4">
<div class="col-4">
<button class="btn btn-outline-success w-100 tab-btn active" onclick="cambiarTipo('vaciado_linea_1',this)">
Línea 1
</button>
</div>

<div class="col-4">
<button class="btn btn-outline-success w-100 tab-btn" onclick="cambiarTipo('vaciado_linea_2',this)">
Línea 2
</button>
</div>

<div class="col-4">
<button class="btn btn-outline-success w-100 tab-btn" onclick="cambiarTipo('hidrocooler',this)">
Hidro
</button>
</div>
</div>

<form id="formControl">

<label class="form-label fw-bold">OPERADOR RESPONSABLE</label>
<input id="operador" class="form-control mb-3" required>

<div class="section-title">
<i class="bi bi-droplet"></i> Control de estanque
</div>

<div class="row g-3">

<div class="col-6">
<label class="form-label">PPM</label>
<input id="ppm" type="number" step="0.1" class="form-control">
</div>

<div class="col-6">
<label class="form-label">ORP</label>
<input id="orp" type="number" class="form-control">
</div>

<div class="col-6">
<label class="form-label">PH</label>
<input id="ph" type="number" step="0.1" class="form-control">
</div>

<div class="col-6" id="bloqueKilos">
<label class="form-label">KILOS</label>
<input id="kilos" type="number" class="form-control">
</div>

</div>

<div class="form-check form-switch my-4">
<input class="form-check-input" type="checkbox" id="correccion">
<label class="form-check-label fw-bold">¿Es corrección?</label>
</div>


<label class="form-label fw-bold">FOTO DE RESPALDO (OBLIGATORIA)</label>

<input id="foto" type="file" accept="image/*" capture="environment" hidden>

<label for="foto" class="file-label">
<i class="bi bi-camera-fill fs-3"></i>
<br>
<span id="fotoTexto">Tomar fotografía</span>
</label>


<button class="btn btn-success w-100 mt-4 fw-bold p-3">
<i class="bi bi-cloud-upload"></i>
GUARDAR REGISTRO
</button>

</form>


<div id="mensaje" class="alert alert-success mt-3 d-none text-center fw-bold">
Registro guardado
</div>

<div id="error" class="alert alert-danger mt-3 d-none"></div>

</div>
</div>
</div>


<script>

const WEB_APP_URL="https://script.google.com/macros/s/AKfycbxnVLO6fLBvmtiWCcE6ZZFBy1H3TSxSJA4sxq3HVc3CpZjVnpVcNyJION_U5XPCJhqlJQ/exec";

let tipoActual="vaciado_linea_1";


function cambiarTipo(tipo,btn){

tipoActual=tipo;

document.querySelectorAll(".tab-btn")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

document.getElementById("bloqueKilos").style.display=
tipo==="hidrocooler"?"none":"block";

}


foto.addEventListener("change",()=>{
fotoTexto.innerHTML="✅ Foto cargada";
});


formControl.addEventListener("submit",e=>{

e.preventDefault();

let archivo=foto.files[0];

if(!operador.value.trim()){
return mostrarError("Ingrese operador");
}

if(!archivo){
return mostrarError("Debe tomar fotografía");
}


let reader=new FileReader();

reader.onload=()=>{

let datos={
origen:tipoActual,
operador:operador.value.trim(),
ppm:Number(ppm.value),
orp:Number(orp.value),
ph:Number(ph.value),
kilos:tipoActual==="hidrocooler"?null:Number(kilos.value),
correccion:correccion.checked,
foto:reader.result
};


fetch(WEB_APP_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(datos)
})
.then(()=>{
mensaje.classList.remove("d-none");
formControl.reset();
operador.value=operador.value;
fotoTexto.innerHTML="Tomar fotografía";
});

};

reader.readAsDataURL(archivo);

});


function mostrarError(t){
error.innerHTML="⚠️ "+t;
error.classList.remove("d-none");
}

</script>

</body>
</html>
'''

path = Path("/mnt/data/control_estanques.html")
path.write_text(html, encoding="utf-8")

str(path)
